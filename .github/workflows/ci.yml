name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rabithole
          POSTGRES_USER: rabithole
          POSTGRES_PASSWORD: password
        ports: [ "5432:5432" ]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (frontend)
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Backend dependencies and build
        working-directory: .
        run: |
          cargo test
          cargo build --release