name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rabithole
          POSTGRES_USER: rabithole
          POSTGRES_PASSWORD: password
        ports: [ "5432:5432" ]
        options: >-
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3

      - name: Backend dependencies and build
        working-directory: .
        run: |
          cargo update
          cargo test
          cargo build --release

      - name: Install dependencies (frontend)
        working-directory: frontend
        run: |
          pnpm install
          pnpm run lint
          pnpm run build