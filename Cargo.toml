[package]
name = "rabithole"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1.38", features = ["full"] }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-postgres = "0.7"
chrono = "0.4"
bcrypt = "0.10"
razorpay = "2.6"

[[bin]]
name = "ingestion_cli"
path = "src/bin/ingestion_cli.rs"
